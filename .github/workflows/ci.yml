name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Run behavior tests
        run: python -m pytest -q
      - name: Dry-run fixture reproducibility (same seed -> identical bytes)
        run: |
          python -m embodied_trackpad.cli --out /tmp/fixture-a --seed 7 --steps 8 \
            --created-utc 2026-10-30T00:00:00Z
          python -m embodied_trackpad.cli --out /tmp/fixture-b --seed 7 --steps 8 \
            --created-utc 2026-10-30T00:00:00Z
          diff -r /tmp/fixture-a /tmp/fixture-b
