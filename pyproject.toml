[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "embodied-trackpad"
version = "0.1.0"
description = "Foundation contracts, validation, and recording for the Embodied Trackpad project (protocol v2 draft)."
readme = "docs/foundation.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "jsonschema>=4.21",
    "numpy==2.2.6",
    "Pillow==12.0.0",
]
vision = [
    "numpy==2.2.6",
    "Pillow==12.0.0",
]

[project.scripts]
embodied-trackpad-dryrun = "embodied_trackpad.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
